name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# По умолчанию токен получает объём прав репозитория, ни один из шагов job
# `test` в такой полноте не нуждается — только чтение. Job `release` поднимает
# `contents: write` явно, этот блок её не отменяет: permissions на уровне job
# полностью замещают permissions на уровне workflow для этой job.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # setup-node не умеет читать mise.toml (TOML) — проверено прогоном:
          # с node-version-file: mise.toml он принял строку "[tools]" за
          # версию и упал. Поэтому пин продублирован числом здесь, так же,
          # как flutter-version продублирован ниже для Flutter; за
          # расхождением с mise.toml следит test/toolchain.test.js.
          node-version: "20"
      # Гейты токенов: целостность ссылок, контраст WCAG AA, брендовая
      # чётность, свежесть закоммиченного tokens.g.dart и совпадение пинов
      # Flutter и Node в этом файле с mise.toml.
      - run: npm test
      - uses: subosito/flutter-action@v2
        with:
          # Дублирует mise.toml вынужденно: flutter-action не читает ни
          # mise.toml, ни .tool-versions, а pubspec библиотеки держит диапазон,
          # а не пин. За расхождением следит test/toolchain.test.js.
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: packages/aurora_design_system
      - run: flutter analyze
        working-directory: packages/aurora_design_system
      - run: flutter test
        working-directory: packages/aurora_design_system
      # build/ лежит в .gitignore: артефакт — единственный способ отдать
      # превью, CSS и Figma-JSON дизайнеру, не требуя клона и Node.
      #
      # Без if: always() — намеренно. С ним шаг выполнился бы и после
      # красного npm test/flutter test/npm run build, но build/ в этом случае
      # либо не существует, либо устарел, и if-no-files-found: error давал бы
      # второй красный шаг поверх уже красного, с сообщением, не называющим
      # первопричину (и точно так же красным после отмены прогона). Без
      # always() шаг просто пропускается, когда что-то раньше упало, —
      # виден один красный шаг, тот, что действительно сломался.
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: design-system-build
          path: build/
          if-no-files-found: error

  # Релиз по стандарту «тег — выход CI»: версия в pubspec пакета — единственный
  # источник. Пуш в main с версией, у которой ещё нет тега, создаёт тег и
  # релиз. Руками теги не ставятся.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Version from pubspec.yaml
        id: version
        run: |
          pubspec=packages/aurora_design_system/pubspec.yaml
          v=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' "$pubspec")
          test -n "$v" || { echo "version not found in $pubspec"; exit 1; }
          test -f "changelog/$v.md" || { echo "changelog/$v.md is missing - write the changelog entry before bumping the version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v is already tagged - nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.version.outputs.release == 'true'
        with:
          node-version: "20"
      # Галерею компонентов в превью рисует Flutter, а не Node: без него
      # `npm run build` соберёт превью без снимков и не упадёт — так в релиз
      # 0.2.2 и уехал файл на 89 КБ вместо 680. Дублирует пин из test-job
      # вынужденно, по той же причине, что и там: flutter-action не читает
      # mise.toml, а за расхождением следит test/toolchain.test.js.
      - uses: subosito/flutter-action@v2
        if: steps.version.outputs.release == 'true'
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
        if: steps.version.outputs.release == 'true'
        working-directory: packages/aurora_design_system
      - run: npm run build
        if: steps.version.outputs.release == 'true'
      # Превью со снимками весит сотни килобайт, без них — десятки. Порог
      # ловит ровно ту тихую деградацию, из-за которой релиз 0.2.2 вышел
      # неполным: собралось, не упало, а галереи внутри нет.
      - name: Preview must carry the gallery
        if: steps.version.outputs.release == 'true'
        run: |
          size=$(stat -c%s build/preview.html)
          test "$size" -gt 300000 || { echo "preview.html is $size bytes - the component gallery is missing"; exit 1; }
      - name: Tag and GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Тело релиза — запись changelog без строки заголовка версии.
          awk 'NR > 1' "changelog/$VERSION.md" > release-notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file release-notes.md \
            build/preview.html build/design-system.css build/figma-variables.json
