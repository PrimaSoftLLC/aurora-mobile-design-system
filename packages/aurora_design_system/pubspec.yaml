name: aurora_design_system
description: Дизайн-система Aurora — токены, темы и компоненты.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# flutter:
#   fonts:
#     - family: Inter
#       fonts:
#         - asset: assets/fonts/Inter-Regular.ttf
#           weight: 400
#         - asset: assets/fonts/Inter-Medium.ttf
#           weight: 500
#         - asset: assets/fonts/Inter-SemiBold.ttf
#           weight: 600
#         - asset: assets/fonts/Inter-Bold.ttf
#           weight: 700
#
# Раскомментировать, когда дизайнер положит эти четыре файла в
# aurora_design_system/assets/fonts/. До тех пор `fontFamily: 'Inter'`
# в токенах и в auroraThemeData просто не резолвится в незарегистрированное
# семейство и откатывается на платформный шрифт по умолчанию — это корректное
# поведение, а объявление шрифта, файлов которого нет на диске, ломает сборку
# ассетов при `flutter test`/`flutter build`.
