name: aurora_design_system
description: Дизайн-система Aurora — токены, темы и компоненты.
version: 0.2.1
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        # Вариативный файл: одно начертание на все веса. Оси — opsz и wght;
        # вес выбирается через fontVariations в tokens.g.dart, поэтому
        # перечислять здесь weight не нужно и нельзя.
        - asset: assets/fonts/InterVariable.ttf
